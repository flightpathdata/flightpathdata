title: FlightPath Data
email: info@flightpathdata.com
description: >- # this means to ignore newlines until "baseurl:"
 FlightPath Data is Edge Data Governance infrastructure that controls inbound tabular data file feeds. It is a governance-first gateway sitting behind MFT and ahead of ETL, enforcing data contracts.
baseurl: "/" # the subpath of your site, e.g. /blog
url: "https://www.flightpathdata.com"
github_username:  flightpathdata

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

footer_content: 'Copyright &copy; 2025-2026 Atesta Analytics; CsvPath committers; D. Kershaw.'

#logo: "assets/logos/logo_wordmark_sm.png"
logo: "/assets/logos/flightpath-data-full-wordmark-and-icon-new.svg.png"
#favicon_ico: "assets/images/favicon.ico"

aux_links:
  Home:
    - https://www.flightpathdata.com
  CsvPath:
    - https://www.csvpath.org
  Blog:
    - https://blog.csvpath.org

nav_external_links:
  - title: CsvPath Framework How-Tos
    url: https://www.csvpath.org/topics/how-tos
    hide_icon: false
    opens_in_new_tab: true
  - title: OpenAPI Docs
    url: https://www.flightpathdata.com/swagger/dist/#/
    hide_icon: false
    opens_in_new_tab: true



theme: just-the-docs

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
#

enable_copy_code_button: true



callouts_level: quiet # or loud
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red



kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false
